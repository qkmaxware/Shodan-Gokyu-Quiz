		const kindEl = document.getElementById("kind");
		const nameEl = document.getElementById("name");
		const nextBtn = document.getElementById("nextBtn");

		const voices = speechSynthesis.getVoices();
		const jaVoice = voices.find(v => v.lang === 'ja-JP');

		function speakJapanese(romaji) {
		  const kana = wanakana.toKana(romaji);

		  const utterance = new SpeechSynthesisUtterance(kana);
		  utterance.lang = 'ja-JP';

		  if (jaVoice) {
			utterance.voice = jaVoice;
		  }

		  speechSynthesis.speak(utterance);
		}

		function shuffle(array) {
			let currentIndex = array.length;

			// While there remain elements to shuffle...
			while (currentIndex != 0) {
				// Pick a remaining element...
				let randomIndex = Math.floor(Math.random() * currentIndex);
				currentIndex--;

				// And swap it with the current element.
				[array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
			}
		}

		var current_index = -1;
		shuffle(moves);

		nextBtn.addEventListener("click", () => {
			if (current_index < 0 || current_index > moves.length) {
				current_index = 0;
				shuffle(moves);
			}
			
			const randomIndex = current_index;
			const item = moves[randomIndex];

			kindEl.textContent = item.kind;

			nameEl.innerHTML = `
			<a href="${item.uri}" target="_blank" rel="noopener noreferrer">
			  ${wanakana.toKana(item.name)}<br>${item.name}
			</a>
			`;

			nextBtn.innerText = current_index >= (moves.length - 1) ? "Restart" : `Next ${current_index + 1}/${moves.length}`;
			nextBtn.classList.remove("restart");
			nextBtn.classList.remove("next");
			nextBtn.classList.add(current_index >= (moves.length - 1) ? "restart" : "next");
			speakJapanese(item.name);
			current_index++;
		});
