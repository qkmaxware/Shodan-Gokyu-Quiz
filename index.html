		body {
		  margin: 0;

   height: 100dvh;

   <ol id="mistakes"></ol>

			{name: "ude-garami", kind: "kansetsu-waza", uri: "https://www.youtube.com/watch?v=AIlTvZb4RlE"},
			{name: "ude-hishigi-juji-gatame", kind: "kansetsu-waza", uri: "https://www.youtube.com/watch?v=OWgSOlCuMXw"},
			{name: "ude-hishigi-ude-gatame", kind: "kansetsu-waza", uri: "https://www.youtube.com/watch?v=SBf0aTma1VI"},
			{name: "ude-hishigi-hiza-gatame", kind: "kansetsu-waza", uri: "https://www.youtube.com/watch?v=H2HtAJdiJcE"},
			{name: "ude-hishigi-waki-gatame", kind: "kansetsu-waza", uri: "https://www.youtube.com/watch?v=8F5p1zuJRG0"},
			{name: "ude-hishigi-hara-gatame", kind: "kansetsu-waza", uri: "https://www.youtube.com/watch?v=ZzEycg8R_9M"},
		];

		const kindEl = document.getElementById("kind");
		const nameEl = document.getElementById("name");
		const countEl = document.getElementById("count");
		const scoreEl = document.getElementById("score");
  const mistakeEl = document.getElementById("mistakes");

		const voices = speechSynthesis.getVoices();
		const jaVoice = voices.find(v => v.lang === 'ja-JP');

		function speakJapanese(romaji) {
		  const kana = wanakana.toKana(romaji);

		  const utterance = new SpeechSynthesisUtterance(kana);
		  utterance.lang = 'ja-JP';

		  if (jaVoice) {
			utterance.voice = jaVoice;
		  }

		  speechSynthesis.speak(utterance);
		}

		function shuffle(array) {
			let currentIndex = array.length;

			// While there remain elements to shuffle...
			while (currentIndex != 0) {
				// Pick a remaining element...
				let randomIndex = Math.floor(Math.random() * currentIndex);
				currentIndex--;

				// And swap it with the current element.
				[array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
			}
		}

		const noBtn = document.getElementById("noBtn");
		const yesBtn = document.getElementById("yesBtn");
		const startBtn = document.getElementById("startBtn");
		const restartBtn = document.getElementById("restartBtn");
		const STATES = {
			Start: 1,
			Quiz: 2,
			Results: 3
		};
		let state = 0;
		const startState = document.getElementById("intro");
		const quizState = document.getElementById("quiz");
		const resultState = document.getElementById("results");
		function setState(nextState) {
			startState.classList.add("hide");
			quizState.classList.add("hide");
			resultState.classList.add("hide");

			if (nextState == STATES.Start) {
				startState.classList.remove("hide");
			} else if (nextState == STATES.Quiz) {
				quizState.classList.remove("hide");
			} else if (nextState == STATES.Results) {
				resultState.classList.remove("hide");
			} 
			state = nextState;
		}
		setState(STATES.Start);

		let correct = 0;
		let failed = 0;
  let failed_moves = [];
		var current_index = -1;

		function updateQuizEntry() {
			const randomIndex = current_index;
			const item = moves[randomIndex];

			kindEl.textContent = item.kind;
			countEl.textContent = `${current_index + 1}/${moves.length}`;

			nameEl.innerHTML = `
			<a href="${item.uri}" target="_blank" rel="noopener noreferrer">
			  ${wanakana.toKana(item.name)}<br>${item.name}
			</a>
			`;

			speakJapanese(item.name);
		}
			
		startBtn.addEventListener("click", () => {
			shuffle(moves);
			current_index = 0;
   correct = 0;
				failed = 0;
   failed_moves = [];
			setState(STATES.Quiz);
			updateQuizEntry();
		});
		restartBtn.addEventListener("click", () => {
			shuffle(moves);
			current_index = 0;
   correct = 0;
				failed = 0;
   failed_moves = [];
			setState(STATES.Quiz);
			updateQuizEntry();
		});
		
		function setScore(){
			var total = correct + failed
			var percent = Math.trunc(100 * (correct / total));
			scoreEl.textContent = `${correct}/${total} (${percent}%)`;

			mistakeEl.innerHTML = "";
			if (failed_moves.length > 0) {
				failed_moves.forEach(move => {
					const li = document.createElement('li');
					const a = document.createElement('a');
					a.href = move.uri;
					a.target = '_blank';
					a.rel = 'noopener noreferrer';
					a.textContent = move.name;
					li.appendChild(a);
					mistakeEl.appendChild(li);
				});
			}
		}
		
		noBtn.addEventListener("click", () => {
			if (current_index < 0 || current_index >= (moves.length - 1)) {
				if (current_index === (moves.length - 1)) {
					failed++;
					failed_moves.push(moves[current_index]);
				}
				setState(STATES.Results);
				setScore();
				correct = 0;
				failed = 0;
   failed_moves = [];
				return;
			}

			const item = moves[current_index];
			failed++;
   failed_moves.push(item);
			current_index++;
			updateQuizEntry();
		});
		yesBtn.addEventListener("click", () => {
			if (current_index < 0 || current_index >= (moves.length - 1)) {
				correct ++;
				setState(STATES.Results);
				setScore();
				correct = 0;
				failed = 0;
   failed_moves = [];
				return;
			}
			
			correct++;
			current_index++;
			updateQuizEntry();
		});
		</script>
